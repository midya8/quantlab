[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "quantlab"
version = "0.3.0"
description = "Packed int8 weights, activation integer dot products and exact arithmetic audits"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}

[project.scripts]
quantlab = "quantlab.cli:main"

[tool.setuptools.package-data]
quantlab = ["data/*.json"]
